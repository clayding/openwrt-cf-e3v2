name: Build OpenWrt HC5661A with USB + Fibocom L716

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    - name: Checkout OpenWrt 23.05
      run: |
        git clone --depth 1 -b openwrt-23.05 https://github.com/openwrt/openwrt.git
        cd openwrt && git log --oneline -1

    - name: Patch HC5661A DTS for CF-E3V2 4G support
      run: |
        cd openwrt
        DTS="target/linux/ramips/dts/mt7628an_hiwifi_hc5661a.dts"
        
        # 1. Enable EHCI and OHCI
        sed -i '/&ehci {/{n;s/status = "disabled"/status = "okay"/}' $DTS
        sed -i '/&ohci {/{n;s/status = "disabled"/status = "okay"/}' $DTS
        
        # 2. Release GPIO-2 pinmux group for Fibocom power control
        # Add uart1 group to gpio function so GPIO-2/3 become available
        sed -i '/groups = "i2c"/s/"i2c"/"uart1", "i2c"/' $DTS
        
        # 3. Add Fibocom L716 power regulator using GPIO-2 (ACTIVE LOW)
        # Using correct &gpio reference for MT7628AN
        printf '\n&gpio {\n};\n\n/ {\n\tfibocom_power: fibocom-power {\n\t\tcompatible = "regulator-fixed";\n\t\tregulator-name = "fibocom_power";\n\t\tgpio = <&gpio 2 1>;\n\t\tregulator-always-on;\n\t\tregulator-boot-on;\n\t\tenable-active-low;\n\t};\n};\n' >> $DTS
        
        echo "DTS patch done"
        grep -A3 "ehci\|ohci\|fibocom\|uart1" $DTS | head -20

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure build
      run: |
        cd openwrt
        echo "CONFIG_TARGET_ramips=y" >> .config
        echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
        echo "CONFIG_TARGET_ramips_mt76x8_DEVICE_hiwifi_hc5661a=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-dwc2=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb2=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-core=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-3g=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-qmi=y" >> .config
        echo "CONFIG_PACKAGE_umbim=y" >> .config
        echo "CONFIG_PACKAGE_devmem2=y" >> .config
        make defconfig

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s 2>&1 | tail -20
        ls -lh bin/targets/ramips/mt76x8/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-hc5661a-fibocom-l716-v2
        path: openwrt/bin/targets/ramips/mt76x8/*hc5661a*.bin
        retention-days: 7
