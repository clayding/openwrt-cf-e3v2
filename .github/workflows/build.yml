name: Build OpenWrt CF-E3V2 Full (USB + Fibocom L716 4G + 3ginfo)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    - name: Checkout OpenWrt 23.05
      run: |
        git clone --depth 1 -b openwrt-23.05 https://github.com/openwrt/openwrt.git
        cd openwrt && git log --oneline -1

    - name: Patch HC5661A DTS (EHCI/OHCI + GPIO-2 Fibocom power)
      run: |
        cd openwrt
        DTS="target/linux/ramips/dts/mt7628an_hiwifi_hc5661a.dts"
        sed -i '/&ehci {/{n;s/status = "disabled"/status = "okay"/}' $DTS
        sed -i '/&ohci {/{n;s/status = "disabled"/status = "okay"/}' $DTS
        printf '\n&gpio {\n};\n\n/ {\n\tfibocom_power: fibocom-power {\n\t\tcompatible = "regulator-fixed";\n\t\tregulator-name = "fibocom_power";\n\t\tgpio = <&gpio 2 1>;\n\t\tregulator-always-on;\n\t\tregulator-boot-on;\n\t\tenable-active-low;\n\t};\n};\n' >> $DTS
        grep -c "fibocom\|okay" $DTS

    - name: Add luci-app-3ginfo-lite package + L716 semicolon patch
      run: |
        cd openwrt
        git clone --depth 1 https://github.com/4IceG/luci-app-3ginfo-lite.git /tmp/3gl
        cp -r /tmp/3gl/luci-app-3ginfo-lite package/luci-app-3ginfo-lite
        # Patch: L716 does not support ; concatenated AT commands
        SH="package/luci-app-3ginfo-lite/root/usr/share/3ginfo-lite/3ginfo.sh"
        awk '/O=$\(sms_tool -D -d $DEVICE at "AT\+CSQ;/ { print "\tO=$(for c in \"AT+CSQ\" \"AT+COPS=3,0\" \"AT+COPS?\" \"AT+COPS=3,2\" \"AT+COPS?\" \"AT+CREG=2\" \"AT+CREG?\" \"AT+CEREG=2\" \"AT+CEREG?\" \"AT+CPIN?\"; do sms_tool -d $DEVICE at \"$c\" 2>/dev/null; done)"; next } { print }' $SH > $SH.new && mv $SH.new $SH
        grep -c 'for c in' $SH

    - name: Embed Fibocom keepalive daemon + boot config
      run: |
        cd openwrt
        mkdir -p files/usr/bin files/etc/init.d files/etc/uci-defaults
        echo '' | base64 -d > files/usr/bin/fibocom_daemon.sh
        echo 'IyEvYmluL3NoIC9ldGMvcmMuY29tbW9uClNUQVJUPTkwClNUT1A9MTAKVVNFX1BST0NEPTEKc3RhcnRfc2VydmljZSgpIHsKICAgIHByb2NkX29wZW5faW5zdGFuY2UKICAgIHByb2NkX3NldF9wYXJhbSBjb21tYW5kIC91c3IvYmluL2ZpYm9jb21fZGFlbW9uLnNoCiAgICBwcm9jZF9zZXRfcGFyYW0gcmVzcGF3bgogICAgcHJvY2RfY2xvc2VfaW5zdGFuY2UKfQo=' | base64 -d > files/etc/init.d/fibocom_keepalive
        echo '' | base64 -d > files/etc/uci-defaults/99_cfe3v2_setup
        chmod +x files/usr/bin/fibocom_daemon.sh files/etc/init.d/fibocom_keepalive files/etc/uci-defaults/99_cfe3v2_setup
        ls -lR files/

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure build
      run: |
        cd openwrt
        cat >> .config << 'CFG'
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt76x8=y
CONFIG_TARGET_ramips_mt76x8_DEVICE_hiwifi_hc5661a=y
CONFIG_PACKAGE_kmod-usb-dwc2=y
CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb-core=y
CONFIG_PACKAGE_kmod-usb-net=y
CONFIG_PACKAGE_kmod-usb-net-rndis=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
CONFIG_PACKAGE_kmod-usb-serial=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_sms-tool=y
CONFIG_PACKAGE_comgt=y
CONFIG_PACKAGE_uqmi=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-proto-3g=y
CONFIG_PACKAGE_luci-proto-qmi=y
CONFIG_PACKAGE_luci-app-3ginfo-lite=y
CONFIG_PACKAGE_umbim=y
CFG
        make defconfig

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s 2>&1 | tail -25
        ls -lh bin/targets/ramips/mt76x8/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-cf-e3v2-full
        path: openwrt/bin/targets/ramips/mt76x8/*hc5661a*.bin
        retention-days: 30
